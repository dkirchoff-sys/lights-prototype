<style>
:root{
  --stage:#dcdce2;
  --stage-ink:#6b6b72;
  --surface:#f2f2f6;
  --ink:#404040;
  --ink-2:#636466;
  --ink-menu:#1a1a1a;
  --amber:#f8b541;
  --hair:#dbdbdb;
  --font:-apple-system,"SF Pro Text","SF Pro",BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sb:62px;
  --u:118px;
  --spring-bouncy:cubic-bezier(.34,1.56,.64,1);
  --spring-soft:cubic-bezier(.25,1.2,.5,1);
  /* iOS Liquid Glass: translucent body, backdrop blur + saturation, bright specular rim, soft ambient lift */
  /* glass tuning: amount of white in the glass (0 = fully clear, 1 = solid) — driven by the side panel */
  --card-a:0; --card-on-a:.12; --ctl-a:0; --ctl-a2:0;
  --glass-bg:rgba(255,255,255,var(--ctl-a2));
  --glass-bg-strong:rgba(255,255,255,var(--ctl-a));
  --glass-fill:linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.04) 55%,rgba(255,255,255,.16) 100%);
  --glass-blur:blur(16px) saturate(2.2);
  --glass-edge:0 0 0 .5px rgba(0,0,0,.05);
  --glass-lift:0 1px 2px rgba(0,0,0,.03),0 8px 22px rgba(0,0,0,.05);
  --glass-sheen:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.3),inset 0 0 12px rgba(255,255,255,.35);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --stage:#1c1c1f; --stage-ink:#9a9aa2; }
}
:root[data-theme="dark"]{ --stage:#1c1c1f; --stage-ink:#9a9aa2; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); overscroll-behavior:none; }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; height:100%; background:var(--stage);
  font-family:var(--font); -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; overscroll-behavior:none;
}
button{ font:inherit; color:inherit; border:0; background:none; padding:0; margin:0; cursor:pointer; }
:focus-visible{ outline:2px solid #3b82f6; outline-offset:2px; }

.stage{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px 16px; max-height:100%; }
.hint{ color:var(--stage-ink); font-size:13px; line-height:18px; text-align:center; max-width:402px; margin:0; }

.phone{
  position:relative; width:402px; height:874px; max-height:calc(100dvh - 90px);
  background:var(--surface); border-radius:44px; overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.06),0 30px 80px rgba(0,0,0,.18);
  isolation:isolate; user-select:none; -webkit-user-select:none;
}

/* ---------- top bar ---------- */
.topbar{ position:absolute; left:0; right:0; top:0; z-index:5;
  background:linear-gradient(to bottom,rgba(242,242,246,.92),rgba(242,242,246,.55) 62%,rgba(242,242,246,0)); pointer-events:none; }
.topbar > *{ pointer-events:auto; }
.status{ height:var(--sb); display:flex; align-items:center; justify-content:center; padding:2.333px 9px 0; }
.status .time{ flex:1; display:flex; justify-content:center; padding-right:6px; font-weight:600; font-size:17px; line-height:22px; color:#000; }
.status .island{ width:125px; height:37px; border-radius:100px; background:#000; flex:none; }
.status .levels{ flex:1; display:flex; justify-content:center; padding-right:1px; }
.toolbar{ position:relative; height:56px; padding:0 16px 12px; }
.tb-mode{ position:absolute; inset:0 16px 12px; display:flex; align-items:flex-start; justify-content:space-between;
  transition:opacity .2s ease, transform .2s ease; }
.tb-mode[hidden]{ display:flex; opacity:0; pointer-events:none; transform:translateY(-4px); }
.leading{ display:flex; gap:6px; align-items:center; }

.gbtn{ position:relative; height:44px; min-width:44px; padding:4px; border-radius:1000px;
  display:inline-flex; align-items:center; justify-content:center; color:var(--ink);
  background:var(--glass-fill),var(--glass-bg-strong);
  box-shadow:var(--glass-edge),var(--glass-lift),var(--glass-sheen);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  transition:transform .12s ease; }
.gbtn:active{ transform:scale(.94); }
.gbtn .sym{ width:36px; height:36px; display:flex; align-items:center; justify-content:center; }
.gbtn.text{ padding:4px 6px; }
.gbtn.text span{ height:36px; padding:0 6px; display:flex; align-items:center; font-weight:510; font-size:17px; }
.title{ display:flex; gap:6px; align-items:center; padding:4px 0; }
.title .label{ height:36px; display:flex; align-items:center; font-weight:510; font-size:17px; color:var(--ink); }
.title .chip{ width:22px; height:22px; border-radius:100px; background:#e8e8eb; display:flex; align-items:center; justify-content:center; }

/* ---------- widgets ---------- */
.scroll{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  padding:calc(var(--sb) + 64px) 16px 140px; scrollbar-width:none; }
.scroll::-webkit-scrollbar{ display:none; }
.grid{ display:grid; grid-template-columns:repeat(3,var(--u)); grid-auto-rows:var(--u); gap:8px; grid-auto-flow:row dense; }

.w{ position:relative; border-radius:26px; outline:none;
  transition:scale .6s var(--spring-bouncy), opacity .2s ease; cursor:pointer; touch-action:none; }
.w.h-axis{ touch-action:pan-y; }
.w:focus-visible{ box-shadow:0 0 0 2px #3b82f6; }
.w.pressed{ scale:.96; transition:scale .14s ease-out; }
.w.dragging{ transition:none; }
.glass{ position:absolute; inset:0; border-radius:26px; overflow:hidden; background:var(--glass-fill),rgba(255,255,255,var(--card-a));
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-edge),var(--glass-lift),var(--glass-sheen); transition:box-shadow .25s ease, background .3s ease; }
.w.on .glass{ background:var(--glass-fill),rgba(255,255,255,var(--card-on-a)); }
/* specular rim shared by every glass surface: bright top-left, fading, catching light again bottom-right */
.glass::after,.gbtn::after,.tabbar::after,.orb::after,.menu::after,.del::after{
  content:""; position:absolute; inset:0; z-index:1; border-radius:inherit; pointer-events:none; padding:1px;
  background:linear-gradient(150deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.4) 28%,rgba(255,255,255,0) 55%,rgba(255,255,255,.6) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); mask-composite:exclude; }
.fill{ position:absolute; left:0; bottom:0; background:var(--amber); opacity:0; pointer-events:none;
  transition:height .5s var(--spring-soft), width .5s var(--spring-soft), opacity 0s; }
.w.on .fill{ opacity:.25; transition:height .5s var(--spring-soft), width .5s var(--spring-soft), opacity .12s ease; }
.w.v-axis .fill{ right:0; }
.w.h-axis .fill{ top:0; }
.w.dragging .fill{ transition:opacity .2s ease; }
.content{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:calc(100% - 20px); max-width:98px;
  display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.icon{ width:44px; height:44px; display:flex; align-items:center; justify-content:center; }
.icon svg path{ transition:fill .2s ease; }
.copy{ width:100%; text-align:center; font-size:13px; line-height:18px; letter-spacing:-.08px; }
.copy .name{ font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.copy .state{ font-weight:400; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.w.on .copy .state{ color:var(--ink); }

/* edit affordances */
.del,.grab{ position:absolute; z-index:2; opacity:0; transform:scale(.5); pointer-events:none;
  transition:opacity .18s ease, transform .55s var(--spring-bouncy); }
.del{ left:-4px; top:-4px; width:20px; height:20px; padding:1.818px; border-radius:1000px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(108,108,116,.6); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.08); }
.del::before{ content:""; position:absolute; inset:-12px; }
.grab{ right:-6px; bottom:-6px; width:32px; height:32px; cursor:nwse-resize; touch-action:none; }
.grab::before{ content:""; position:absolute; inset:-10px; }
.grab svg{ display:block; }
.phone.editing .del,.phone.editing .grab{ opacity:1; transform:none; pointer-events:auto; }
.phone.editing .w{ cursor:default; touch-action:auto; }
.w.resizing{ z-index:3; scale:1.02; }
.w.resizing .glass{ box-shadow:var(--glass-edge),0 16px 36px rgba(0,0,0,.12),var(--glass-sheen); }
.w.removing{ scale:.6; opacity:0; transition:scale .2s ease-in, opacity .18s ease; }
.w.added{ animation:pop .7s var(--spring-bouncy); }
@keyframes pop{ from{ transform:scale(.6); opacity:0; } to{ transform:none; opacity:1; } }

.empty{ grid-column:1 / -1; padding:48px 12px; text-align:center; color:var(--ink-2); font-size:15px; line-height:20px; }
.empty b{ display:block; color:var(--ink); font-weight:600; margin-bottom:4px; }

/* ---------- device widgets ---------- */
.w.tap{ touch-action:manipulation; }
.tint{ position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .35s ease, background-color .35s ease; }
.w.lock.locked .tint{ background:var(--amber); opacity:.25; }
.w.lock .copy .state{ transition:color .2s ease; }
.w.lock.locked .copy .state{ color:var(--ink); }
.w.lock.busy .copy .state{ color:var(--ink-2); }
.w.thermo.cooling .tint{ background:#cfe9ff; opacity:.6; }
.w.thermo.heating .tint{ background:#ffdcc2; opacity:.6; }
.tnum{ position:relative; width:100%; height:44px; display:flex; align-items:center; justify-content:center; }
.tnum .num{ font-weight:700; font-size:28px; line-height:34px; letter-spacing:.38px; color:var(--ink); font-variant-numeric:tabular-nums; transition:color .3s ease; }
.w.thermo.cooling .num{ color:#003b66; }
.w.thermo.heating .num{ color:#7a3300; }
/* thermostat layout per size: arrows are placed against the card, not squeezed into the number row */
.w.thermo{ --tn-size:28px; --tn-h:44px; --chev:32px; --chev-x:10px; --row-off:22px; --tc-gap:8px; }
.w.thermo .content{ width:auto; min-width:98px; max-width:none; gap:var(--tc-gap); }
.w.thermo .tnum{ height:var(--tn-h); }
.w.thermo .tnum .num{ font-size:var(--tn-size); line-height:1.2; }
.w.thermo .chev{ top:calc(50% - var(--row-off)); transform:translateY(-50%); }
.w.thermo .chev.down{ left:var(--chev-x); }
.w.thermo .chev.up{ right:var(--chev-x); }
/* wide: arrows sit out at the card's sides, centred on the whole readout */
.w.thermo[data-size="2x1"]{ --row-off:0px; --chev-x:34px; }
.w.thermo[data-size="3x1"]{ --row-off:0px; --chev-x:48px; }
/* tall: arrows above and below the readout */
.w.thermo[data-size="1x2"] .chev{ left:50%; right:auto; top:52px; bottom:auto; transform:translate(-50%,-50%); }
.w.thermo[data-size="1x2"] .chev.down{ left:50%; right:auto; top:auto; bottom:52px; transform:translate(-50%,50%); }
/* large: bigger readout, arrows at the sides with room to breathe */
.w.thermo[data-size="2x2"]{ --tn-size:56px; --tn-h:72px; --chev:44px; --row-off:0px; --chev-x:22px; --tc-gap:12px; }
.w.thermo[data-size="3x3"]{ --tn-size:80px; --tn-h:100px; --chev:56px; --row-off:0px; --chev-x:32px; --tc-gap:16px; }
.w.thermo[data-size="2x2"] .copy{ font-size:15px; line-height:20px; }
.w.thermo[data-size="3x3"] .copy{ font-size:17px; line-height:22px; }
.chev{ position:absolute; z-index:2; width:var(--chev); height:var(--chev); display:flex; align-items:center; justify-content:center; pointer-events:auto; color:var(--ink); border-radius:50%; transition:background .15s ease, opacity .25s ease; }
.chev svg{ width:calc(var(--chev) * .5); height:auto; display:block; }
.chev.down svg{ transform:rotate(180deg); }
.chev:active{ background:rgba(0,0,0,.06); }
.phone.editing .chev,.phone.editing .golive{ pointer-events:none; }
.w.camera .glass{ background:#2c2621; }
.feed{ position:absolute; inset:0; background-size:cover; background-position:center;
  background-image:
    radial-gradient(ellipse 18% 14% at 27% 30%,rgba(255,236,196,.75),rgba(255,236,196,0) 70%),
    radial-gradient(ellipse 14% 12% at 70% 33%,rgba(255,230,185,.55),rgba(255,230,185,0) 70%),
    linear-gradient(180deg,#a99a86 0%,#cbbda8 44%,#e9e2d6 47%,#8e7c69 49%,#5d4e41 100%); }
.w.camera.live .feed{ animation:livepan 9s ease-in-out infinite alternate; }
@keyframes livepan{ from{ transform:scale(1.02); } to{ transform:scale(1.08) translate(-1.5%,1%); } }
.cam-top,.cam-bot{ position:absolute; left:0; right:0; z-index:2; padding:16px; color:#fff; pointer-events:none; display:flex; gap:16px; }
.cam-top{ top:0; height:80px; align-items:flex-start; background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0)); font-size:12px; line-height:16px; font-weight:510; }
.cam-bot{ bottom:0; height:80px; align-items:flex-end; background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,0)); }
.cam-bot .name{ flex:1; min-width:0; font-weight:600; font-size:13px; line-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cam-ind{ display:flex; gap:8px; align-items:center; padding:4px 8px; border-radius:360px; background:rgba(0,0,0,.2); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); flex:none; }
.cam-ind svg{ display:block; }
.live-pill{ display:inline-flex; align-items:center; gap:5px; font-weight:600; }
.live-dot{ width:7px; height:7px; border-radius:50%; background:#ff453a; animation:blink 1.4s ease-in-out infinite; }
@keyframes blink{ 50%{ opacity:.35; } }
.golive{ position:absolute; left:50%; top:50%; z-index:3; transform:translate(-50%,-50%); height:36px; padding:0 20px; border-radius:1000px; white-space:nowrap;
  color:#fff; font-weight:600; font-size:15px; letter-spacing:-.23px;
  background:rgba(0,0,0,.26); -webkit-backdrop-filter:blur(14px) saturate(1.6); backdrop-filter:blur(14px) saturate(1.6);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.3);
  transition:opacity .3s ease; }
.w.camera.live.idle .golive{ opacity:0; pointer-events:none; }
#mpAdd .mi[data-type] .g svg{ width:22px; height:22px; }
.mpanel[hidden]{ display:none; }
.mi .tr{ margin-left:auto; display:flex; align-items:center; }
.mi .tr svg{ transform:rotate(-90deg); }
.back-chev svg{ transform:rotate(90deg); }
.mi.back .l{ font-weight:600; }
.menu.add-only .mi.back,.menu.add-only .back-sep{ display:none; }
.w.thermo.off .num{ color:var(--ink-2); }
.w.thermo.off .chev{ opacity:0; pointer-events:none; }
.cam-ind.small{ display:none; margin-left:auto; padding:4px 8px; }
.w.camera.compact .cam-ind.small{ display:flex; }
.w.camera.compact .cam-bot .cam-ind{ display:none; }
.w.camera.compact .cam-top,.w.camera.compact .cam-bot{ padding:10px; }
.w.camera.compact:not(.live) .ts{ display:none; }
.menu.left{ right:auto; left:16px; transform-origin:22px 22px; }

/* edit mode: drag cards to move them */
.phone.editing .w .glass{ cursor:grab; touch-action:none; }
.w.moving{ z-index:6; scale:1.05; }
.w.moving .glass{ cursor:grabbing; box-shadow:var(--glass-edge),0 18px 40px rgba(0,0,0,.16),var(--glass-sheen); }
.w.moving .del,.w.moving .grab{ opacity:0; }
.scroll{ -webkit-touch-callout:none; }

/* ---------- menu ---------- */
.scrim{ position:absolute; inset:0; z-index:8; display:none; }
.scrim.open{ display:block; }
.menu{ position:absolute; z-index:9; right:16px; top:var(--sb); width:238px; padding:10px 8px; border-radius:34px; overflow:hidden;
  background:var(--glass-fill),rgba(255,255,255,.55); -webkit-backdrop-filter:blur(24px) saturate(2.2); backdrop-filter:blur(24px) saturate(2.2);
  box-shadow:var(--glass-edge),0 12px 40px rgba(0,0,0,.14),var(--glass-sheen);
  transform-origin:calc(100% - 22px) 22px; transform:scale(.3); opacity:0; pointer-events:none;
  transition:transform .28s cubic-bezier(.3,1.25,.5,1), opacity .16s ease; }
.menu.open{ transform:none; opacity:1; pointer-events:auto; }
.mi{ width:100%; height:40px; display:flex; align-items:center; gap:8px; padding:0 8px 0 6px; border-radius:14px; color:var(--ink-menu); text-align:left; }
.mi:hover{ background:rgba(0,0,0,.04); }
.mi:active{ background:rgba(0,0,0,.08); }
.mi .g{ width:28px; display:flex; justify-content:center; flex:none; }
.mi .l{ padding-left:4px; font-size:17px; line-height:20px; letter-spacing:-.43px; }
.sep{ padding:8px 8px 9px; }
.sep div{ height:1px; background:#e6e6e6; }

/* ---------- bottom tabs ---------- */
.tabs{ position:absolute; left:0; right:0; bottom:0; z-index:5; display:flex; gap:8px; align-items:center; justify-content:center;
  padding:12px 21px 21px; background:linear-gradient(to bottom,rgba(242,242,246,0),rgba(242,242,246,.8)); }
.tabbar{ position:relative; width:298px; height:62px; padding:6px 0; display:flex; align-items:center; border-radius:1000px;
  background:var(--glass-fill),var(--glass-bg);
  box-shadow:var(--glass-edge),var(--glass-lift),var(--glass-sheen);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur); }
.tab{ position:relative; flex:1 0 0; height:54px; margin-right:-18px; padding-bottom:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ink); }
.tab:last-child{ margin-right:0; }
.tab .sel{ position:absolute; inset:0 4px; border-radius:100px; background:rgba(255,255,255,.7); box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.04); opacity:0; transition:opacity .2s ease; }
.tab[aria-selected="true"] .sel{ opacity:1; }
.tab .ti{ position:relative; width:36px; height:36px; margin-bottom:-2px; display:flex; align-items:center; justify-content:center; }
.tab .tl{ position:relative; padding:0 6px; font-weight:600; font-size:10px; line-height:12px; }
.orb{ position:relative; width:62px; height:62px; flex:none; border-radius:1000px; display:flex; align-items:center; justify-content:center;
  background:var(--glass-fill),var(--glass-bg-strong); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-edge),var(--glass-lift),var(--glass-sheen); }
.orb img{ width:70px; height:70px; flex:none; pointer-events:none; }

/* ---------- toast ---------- */
.toast{ position:absolute; left:50%; bottom:112px; z-index:7; transform:translate(-50%,8px); opacity:0; pointer-events:none;
  padding:10px 16px; border-radius:100px; background:rgba(40,40,42,.88); color:#fff; font-size:15px; line-height:20px; white-space:nowrap;
  transition:opacity .2s ease, transform .2s ease; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* full-bleed on phones: real status bar replaces the mock one */
@media (max-width:500px){
  body{ align-items:stretch; }
  .stage{ padding:0; width:100%; gap:0; max-height:none; }
  .hint{ display:none; }
  .phone{ width:100%; height:100%; max-height:none; border-radius:0; box-shadow:none; }
  :root{ --sb:0px; background:var(--surface); }
  body{ background:var(--surface); }
  .status{ display:none; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ transition-duration:0s !important; animation:none !important; }
}

  const POOLS = {
    light: ['Living Room','Bedroom','Hallway','Garage','Office','Patio','Dining Room','Bathroom','Nursery','Driveway'],
    lock: ['Front Door','Garage Door','Side Gate','Patio Door','Basement Door'],
    thermo: ['Upstairs','Downstairs','Bedroom','Office','Basement'],
    camera: ['Front Yard','Driveway','Backyard','Garage','Porch']
  };
  const LABEL = { light: 'Light', lock: 'Lock', thermo: 'Thermostat', camera: 'Camera' };

  let nextId = 1;
  function mk(type, name, extra = {}){
    const base = { id: nextId++, type, name, w: 1, h: 1 };
    if (type === 'light') Object.assign(base, { on: false, b: 100 });
    if (type === 'lock') Object.assign(base, { locked: true, busy: false });
    if (type === 'thermo') Object.assign(base, { on: true, cur: 75, target: 72 });
    if (type === 'camera') Object.assign(base, { w: 2, h: 2, live: false, ts: '2h ago' });
    return Object.assign(base, extra);
  }
  const state = {
    // default layout: tall light, wide lock + thermostat, 3x2 camera
    items: [
      mk('light', 'Front Porch', { h: 2 }),
      mk('lock', 'Back Door', { w: 2, locked: false }),
      mk('thermo', 'Thermostat', { w: 2, cur: 67, target: 66 }),
      mk('camera', 'Kitchen', { w: 3, h: 2 })
    ],
    editing: false
  };

  const phone = document.getElementById('phone');
  const grid = document.getElementById('grid');
  const menu = document.getElementById('menu');
  const mpMain = document.getElementById('mpMain');
  const mpAdd = document.getElementById('mpAdd');
  const scrim = document.getElementById('scrim');
  const moreBtn = document.getElementById('moreBtn');
  const toastEl = document.getElementById('toast');
  const scrollEl = document.getElementById('scroll');
  const els = new Map();
  let unit = 118; const GAP = 8;

  const isHoriz = l => l.w > l.h;
  const find = id => state.items.find(l => l.id === id);
  const thermoMode = t => t.target < t.cur ? 'cooling' : t.target > t.cur ? 'heating' : 'idle';
  const MODE_LABEL = { cooling: 'Cooling', heating: 'Heating', idle: 'Idle', off: 'Off' };

  function measure(){
    unit = Math.max(80, (phone.clientWidth - 48) / 3);
    phone.style.setProperty('--u', unit + 'px');
  }
  new ResizeObserver(measure).observe(phone); measure();

  function build(l){
    const el = document.createElement('div');
    el.className = 'w ' + l.type; el.setAttribute('role', 'listitem');
    let inner = '';
    if (l.type === 'light'){
      inner = `<div class="fill"></div>
        <div class="content"><div class="icon"></div><div class="copy"><div class="name"></div><div class="state"></div></div></div>`;
    } else if (l.type === 'lock'){
      inner = `<div class="tint"></div>
        <div class="content"><div class="icon"></div><div class="copy"><div class="name"></div><div class="state"></div></div></div>`;
    } else if (l.type === 'thermo'){
      inner = `<div class="tint"></div>
        <div class="content"><div class="tnum"><span class="num"></span></div><div class="copy"><div class="name"></div><div class="state"></div></div></div>
        <button class="chev down" aria-label="Lower target temperature">${T_CHEV}</button>
        <button class="chev up" aria-label="Raise target temperature">${T_CHEV}</button>`;
    } else if (l.type === 'camera'){
      inner = `<div class="feed"></div>
        <div class="cam-top"><span class="ts"></span><span class="cam-ind small">${BATTERY}</span></div>
        <div class="cam-bot"><span class="name"></span><span class="cam-ind">${BATTERY}${WIFI}</span></div>
        <button class="golive"></button>`;
    }
    el.innerHTML = `<div class="glass" role="button" tabindex="0">${inner}</div>
      <button class="del" aria-label="Remove ${l.name}">${MINUS}</button>
      <div class="grab" aria-hidden="true">${GRAB()}</div>`;
    el._glass = el.querySelector('.glass');
    el._fill = el.querySelector('.fill');
    el._tint = el.querySelector('.tint');
    el._icon = el.querySelector('.icon');
    el._name = el.querySelector('.name');
    el._state = el.querySelector('.state');
    el._num = el.querySelector('.num');
    el._ts = el.querySelector('.ts');
    el._go = el.querySelector('.golive');
    el._feed = el.querySelector('.feed');
    el._grab = el.querySelector('.grab');
    if (el._feed && CAM_IMG) el._feed.style.backgroundImage = `url(${CAM_IMG})`;
    bindWidget(el, l.id, l.type);
    return el;
  }

  function paint(l){
    const el = els.get(l.id); if (!el) return;
    el.style.gridColumn = 'span ' + l.w; el.style.gridRow = 'span ' + l.h;
    el._name.textContent = l.name;
    const g = el._glass;
    if (l.type === 'light'){
      el.classList.toggle('on', l.on);
      el.classList.toggle('h-axis', isHoriz(l));
      el.classList.toggle('v-axis', !isHoriz(l));
      const want = l.on ? 'on' : 'off';
      if (el._iconState !== want){ el._icon.innerHTML = l.on ? ICON_ON : ICON_OFF; el._iconState = want; }
      el._state.textContent = l.on ? Math.round(l.b) + '%' : 'Off';
      if (isHoriz(l)){ el._fill.style.width = l.b + '%'; el._fill.style.height = ''; }
      else { el._fill.style.height = l.b + '%'; el._fill.style.width = ''; }
      g.setAttribute('aria-label', `${l.name} light, ${l.on ? Math.round(l.b) + ' percent' : 'off'}`);
      g.setAttribute('aria-pressed', String(l.on));
    }
    if (l.type === 'lock'){
      el.classList.toggle('locked', l.locked);
      el.classList.toggle('busy', l.busy);
      const want = l.locked ? 'locked' : 'open';
      if (el._iconState !== want){ el._icon.innerHTML = l.locked ? LOCK_FILL : LOCK_OPEN; el._iconState = want; }
      el._state.textContent = l.busy ? (l.locked ? 'Unlocking…' : 'Locking…') : (l.locked ? 'Locked' : 'Unlocked');
      g.setAttribute('aria-label', `${l.name} lock, ${l.locked ? 'locked' : 'unlocked'}`);
      g.setAttribute('aria-pressed', String(l.locked));
    }
    if (l.type === 'thermo'){
      const mode = l.on ? thermoMode(l) : 'off';
      el.classList.remove('cooling', 'heating', 'idle', 'off'); el.classList.add(mode);
      el.dataset.size = `${l.w}x${l.h}`;
      // big number = target; detail line = mode • current room temperature
      el._num.textContent = l.target;
      el._state.textContent = !l.on ? 'Off' : `${MODE_LABEL[mode]} • ${l.cur}`;
      g.setAttribute('aria-label', `${l.name}, ${l.cur} degrees, ${l.on ? MODE_LABEL[mode] + ', set to ' + l.target : 'off'}`);
      g.setAttribute('aria-pressed', String(l.on));
    }
    if (l.type === 'camera'){
      el.classList.toggle('live', l.live);
      el.classList.toggle('compact', l.w === 1 && l.h === 1);
      el._ts.innerHTML = l.live ? '<span class="live-pill"><span class="live-dot"></span>Live</span>' : l.ts;
      el._go.textContent = l.live ? 'End Live' : 'Go Live';
      g.setAttribute('aria-label', `${l.name} camera${l.live ? ', live' : ''}`);
    }
  }

  function render(){
    const ids = new Set(state.items.map(l => l.id));
    for (const [id, el] of els) if (!ids.has(id)){ el.remove(); els.delete(id); }
    state.items.forEach((l, i) => {
      let el = els.get(l.id);
      if (!el){ el = build(l); els.set(l.id, el); }
      if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
      paint(l);
    });
    let empty = grid.querySelector('.empty');
    if (!state.items.length && !empty){
      empty = document.createElement('div'); empty.className = 'empty';
      empty.innerHTML = '<b>No devices on this dashboard</b>Add one from the ••• menu.';
      grid.appendChild(empty);
    } else if (state.items.length && empty) empty.remove();
  }

  // ---------- lights ----------
  function countUp(el, to){
    cancelAnimationFrame(el._count);
    if (REDUCE.matches) return;
    const t0 = performance.now(), dur = 420;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el._state.textContent = Math.round(to * e) + '%';
      if (k < 1) el._count = requestAnimationFrame(step);
    };
    el._count = requestAnimationFrame(step);
  }

  function toggleLight(l){
    const el = els.get(l.id);
    if (l.on){ l.on = false; }
    else { l.on = true; if (l.b <= 0) l.b = 100; }
    paint(l);
    if (!el) return;
    el._fill.getAnimations().forEach(a => a.cancel());
    const prop = isHoriz(l) ? 'width' : 'height';
    tick(l.on ? 12 : 6);
    if (l.on){
      anim(el._fill, [{ [prop]: '0%' }, { [prop]: l.b + '%' }], { duration: 700, easing: SPRING.soft });
      anim(el._icon, [{ transform: 'scale(.55)' }, { transform: 'none' }], { duration: 700, easing: SPRING.bouncy });
      anim(el._icon, [
        { filter: 'drop-shadow(0 0 0 rgba(248,181,65,0))' },
        { filter: 'drop-shadow(0 0 9px rgba(248,181,65,.8))', offset: .3 },
        { filter: 'drop-shadow(0 0 0 rgba(248,181,65,0))' }
      ], { duration: 800, easing: 'ease-out' });
      countUp(el, Math.round(l.b));
    } else {
      cancelAnimationFrame(el._count);
      // drain to empty, then vanish in the same animation so the full bar never reappears
      anim(el._fill, [
        { [prop]: l.b + '%', opacity: .25 },
        { [prop]: '0%', opacity: .25, offset: .92 },
        { [prop]: '0%', opacity: 0 }
      ], { duration: 340, easing: 'cubic-bezier(.4,0,.7,.2)' });
      anim(el._icon, [{ transform: 'none' }, { transform: 'scale(.86)', offset: .35 }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
    }
  }

  // ---------- locks: tap → short "Locking…" beat, then the bolt lands ----------
  function toggleLock(l){
    if (l.busy) return;
    const el = els.get(l.id);
    l.busy = true; paint(l); tick(6);
    if (el) anim(el._icon, [{ opacity: 1 }, { opacity: .45 }, { opacity: 1 }], { duration: 700, easing: 'ease-in-out', iterations: 1 });
    setTimeout(() => {
      l.busy = false; l.locked = !l.locked; paint(l);
      if (!el) return;
      tick(l.locked ? 14 : 8);
      anim(el._icon, [{ transform: 'scale(.6) rotate(-8deg)' }, { transform: 'none' }], { duration: 650, easing: SPRING.bouncy });
      if (l.locked) anim(el._icon, [
        { filter: 'drop-shadow(0 0 0 rgba(248,181,65,0))' },
        { filter: 'drop-shadow(0 0 9px rgba(248,181,65,.8))', offset: .3 },
        { filter: 'drop-shadow(0 0 0 rgba(248,181,65,0))' }
      ], { duration: 800, easing: 'ease-out' });
    }, REDUCE.matches ? 0 : 650);
  }

  // ---------- thermostats: chevrons change the set point; the big number shows it while you adjust ----------
  function rollNumber(el, dir){
    anim(el._num, [{ transform: `translateY(${dir * 10}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 380, easing: SPRING.soft });
  }
  // tap the card to switch the thermostat off / back on
  function toggleThermo(l){
    const el = els.get(l.id);
    l.on = !l.on; l.adjusting = false;
    if (el) clearTimeout(el._adjT);
    paint(l); tick(l.on ? 12 : 6);
    if (!el) return;
    if (l.on) anim(el._num, [{ transform: 'scale(.7)', opacity: .4 }, { transform: 'none', opacity: 1 }], { duration: 650, easing: SPRING.bouncy });
    else anim(el._num, [{ transform: 'none' }, { transform: 'scale(.88)', offset: .35 }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
  }
  function nudgeThermo(l, dir){
    const el = els.get(l.id);
    if (!l.on){ l.on = true; }
    l.target = Math.max(50, Math.min(90, l.target + dir));
    l.lastNudge = Date.now();
    paint(l); tick(6);
    if (el) rollNumber(el, dir);
  }
  // room temperature drifts one degree toward the set point every few seconds
  setInterval(() => {
    state.items.forEach(l => {
      if (l.type !== 'thermo' || !l.on || l.cur === l.target || Date.now() - (l.lastNudge || 0) < 1200) return;
      const dir = l.target > l.cur ? 1 : -1;
      l.cur += dir; paint(l);
      // the room temperature in the detail line rolls one degree toward the target
      const el = els.get(l.id);
      if (el) anim(el._state, [{ transform: `translateY(${dir * 6}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 380, easing: SPRING.soft });
    });
  }, 2500);

  // ---------- cameras ----------
  function setLive(l, live){
    const el = els.get(l.id);
    l.live = live; if (!live) l.ts = 'Just now';
    paint(l); tick(10);
    if (!el) return;
    anim(el._go, [{ transform: 'translate(-50%,-50%) scale(.85)' }, { transform: 'translate(-50%,-50%)' }], { duration: 500, easing: SPRING.bouncy });
    showCamControls(el, l);
  }
  function showCamControls(el, l){
    el.classList.remove('idle'); clearTimeout(el._idleT);
    if (l.live) el._idleT = setTimeout(() => el.classList.add('idle'), 2500);
  }

  function bindWidget(el, id, type){
    const g = el._glass;
    let p = null;
    if (type !== 'light') el.classList.add('tap');

    g.addEventListener('pointerdown', e => {
      if (state.editing || e.button > 0 || e.target.closest('.chev, .golive')) return;
      const l = find(id); if (!l) return;
      const r = g.getBoundingClientRect();
      p = { id: e.pointerId, x: e.clientX, y: e.clientY, b0: l.on ? l.b : 0, mode: 'pending', size: isHoriz(l) ? r.width : r.height };
      // press always shrinks toward the card's centre (earlier slides/resizes may have moved the origin to an edge)
      el.style.transformOrigin = '50% 50%';
      if (type === 'light' || type === 'lock' || type === 'thermo') el.classList.add('pressed');
      if (e.pointerType === 'mouse') g.setPointerCapture(e.pointerId);
    });
    g.addEventListener('pointermove', e => {
      if (!p || e.pointerId !== p.id) return;
      const l = find(id); if (!l) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (type !== 'light'){
        if (Math.hypot(dx, dy) > 10){ p.mode = 'cancel'; el.classList.remove('pressed'); }
        return;
      }
      const along = isHoriz(l) ? dx : -dy, across = isHoriz(l) ? dy : dx;
      if (p.mode === 'pending'){
        if (Math.abs(along) > 6 && Math.abs(along) >= Math.abs(across)){
          p.mode = 'slide'; p.x = e.clientX; p.y = e.clientY;
          el.classList.add('dragging'); el.classList.remove('pressed');
          try { g.setPointerCapture(e.pointerId); } catch(_){}
        } else if (Math.abs(across) > 10){ p.mode = 'cancel'; el.classList.remove('pressed'); }
        return;
      }
      if (p.mode !== 'slide') return;
      const d = isHoriz(l) ? e.clientX - p.x : -(e.clientY - p.y);
      const raw = p.b0 + d / p.size * 100;
      const b = Math.max(0, Math.min(100, raw));
      const over = raw - b;
      if (over){
        // rubber-band stretch when pushing past 0% or 100%
        const s = 1 + 0.05 * (1 - Math.exp(-Math.abs(over) / 25)), c = 1 - (s - 1) * .4;
        el.style.transformOrigin = isHoriz(l) ? (over > 0 ? 'left center' : 'right center') : (over > 0 ? 'center bottom' : 'center top');
        el.style.scale = isHoriz(l) ? `${s} ${c}` : `${c} ${s}`;
      } else el.style.scale = '';
      if ((b === 100 || b === 0) && l.b !== b) tick(8);
      l.b = b; l.on = b > 0;
      paint(l);
    });
    const end = e => {
      if (!p || e.pointerId !== p.id) return;
      const l = find(id);
      el.classList.remove('pressed', 'dragging');
      el.style.scale = '';
      if (l){
        const tap = p.mode === 'pending' && e.type === 'pointerup';
        if (type === 'light'){
          if (tap) toggleLight(l);
          if (p.mode === 'slide'){ if (l.b <= 0){ l.on = false; l.b = 100; } else l.b = Math.round(l.b); paint(l); }
        }
        if (type === 'lock' && tap) toggleLock(l);
        if (type === 'thermo' && tap) toggleThermo(l);
        if (type === 'camera' && tap) showCamControls(el, l);
      }
      p = null;
    };
    g.addEventListener('pointerup', end);
    g.addEventListener('pointercancel', end);

    if (type === 'thermo'){
      el.querySelectorAll('.chev').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        if (state.editing) return;
        const l = find(id); if (!l) return;
        nudgeThermo(l, btn.classList.contains('up') ? 1 : -1);
        anim(btn, [{ scale: '.8' }, { scale: '1' }], { duration: 450, easing: SPRING.bouncy });
      }));
    }
    if (type === 'camera'){
      el._go.addEventListener('click', e => {
        e.stopPropagation();
        if (state.editing) return;
        const l = find(id); if (l) setLive(l, !l.live);
      });
    }

    g.addEventListener('keydown', e => {
      if (state.editing) return;
      const l = find(id); if (!l) return;
      if (type === 'light'){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleLight(l); }
        const step = { ArrowUp: 10, ArrowRight: 10, ArrowDown: -10, ArrowLeft: -10 }[e.key];
        if (step){ e.preventDefault(); const base = l.on ? l.b : 0; l.b = Math.max(0, Math.min(100, base + step)); l.on = l.b > 0; if (!l.on) l.b = 100; paint(l); }
      }
      if (type === 'lock' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggleLock(l); }
      if (type === 'thermo'){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleThermo(l); }
        const step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
        if (step){ e.preventDefault(); nudgeThermo(l, step); }
      }
      if (type === 'camera' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); setLive(l, !l.live); }
    });

    // move: in edit mode, drag a card; the others reflow around it as you pass over them
    let m = null;
    const layoutPos = () => {
      const s = scrollEl.getBoundingClientRect();
      return { x: s.left + el.offsetLeft - scrollEl.scrollLeft, y: s.top + el.offsetTop - scrollEl.scrollTop };
    };
    const follow = () => {
      const lp = layoutPos();
      m.tx = m.px - m.ax - lp.x; m.ty = m.py - m.ay - lp.y;
      el.style.translate = `${m.tx}px ${m.ty}px`;
    };
    g.addEventListener('pointerdown', e => {
      if (!state.editing || e.button > 0) return;
      e.preventDefault();
      const lp = layoutPos();
      m = { id: e.pointerId, sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY, ax: e.clientX - lp.x, ay: e.clientY - lp.y, tx: 0, ty: 0, started: false, over: null };
      try { g.setPointerCapture(e.pointerId); } catch(_){}
    });
    g.addEventListener('pointermove', e => {
      if (!m || e.pointerId !== m.id) return;
      m.px = e.clientX; m.py = e.clientY;
      if (!m.started){
        if (Math.hypot(m.px - m.sx, m.py - m.sy) < 6) return;
        m.started = true; el.style.transformOrigin = '50% 50%'; el.classList.add('moving'); tick(10);
        (el._flip || []).forEach(a => a.cancel()); el._flip = null;
        m.scrollT = setInterval(() => {
          const s = scrollEl.getBoundingClientRect();
          const dv = m.py < s.top + 120 ? -1 : m.py > s.bottom - 110 ? 1 : 0;
          if (dv){ scrollEl.scrollTop += dv * 8; follow(); }
        }, 16);
      }
      follow();
      // which card is under the finger?
      let target = null;
      for (const [oid, oel] of els){
        if (oid === id) continue;
        const r = oel._glass.getBoundingClientRect();
        if (m.px >= r.left && m.px <= r.right && m.py >= r.top && m.py <= r.bottom){ target = oid; break; }
      }
      if (target === m.over) return;
      m.over = target;
      if (target == null) return;
      const from = state.items.findIndex(x => x.id === id), to = state.items.findIndex(x => x.id === target);
      flip(() => {
        const [it] = state.items.splice(from, 1);
        state.items.splice(to, 0, it);
        render();
      }, id);
      follow(); tick(6);
    });
    const mend = e => {
      if (!m || e.pointerId !== m.id) return;
      clearInterval(m.scrollT);
      if (m.started){
        el.classList.remove('moving');
        el.style.translate = '';
        if (!REDUCE.matches) el.animate([{ translate: `${m.tx}px ${m.ty}px` }, { translate: '0px 0px' }], { duration: 320, easing: SETTLE });
      }
      m = null;
    };
    g.addEventListener('pointerup', mend);
    g.addEventListener('pointercancel', mend);

    // delete
    el.querySelector('.del').addEventListener('click', e => {
      e.stopPropagation();
      const l = find(id); if (!l) return;
      el.classList.add('removing');
      setTimeout(() => flip(() => { state.items = state.items.filter(x => x.id !== id); render(); }), 200);
      toast(`Removed ${l.name}`);
    });

    // resize via grabber — snaps to the six designed sizes
    const grab = el.querySelector('.grab');
    let r = null;
    const stretchTo = (sx, sy) => {
      el._glass.style.marginRight = el._grab.style.marginRight = (-sx) + 'px';
      el._glass.style.marginBottom = el._grab.style.marginBottom = (-sy) + 'px';
      el._sx = sx; el._sy = sy;
    };
    grab.addEventListener('pointerdown', e => {
      if (!state.editing) return;
      e.preventDefault(); e.stopPropagation();
      const l = find(id); if (!l) return;
      grab.setPointerCapture(e.pointerId);
      const s = unit + GAP;
      r = { id: e.pointerId, x: e.clientX, y: e.clientY, pw: l.w * s - GAP, ph: l.h * s - GAP };
      el.style.transformOrigin = 'left top';
      el.classList.add('resizing');
    });
    grab.addEventListener('pointermove', e => {
      if (!r || e.pointerId !== r.id) return;
      const l = find(id); if (!l) return;
      const s = unit + GAP, d = unit * .4;
      const pw = r.pw + (e.clientX - r.x), ph = r.ph + (e.clientY - r.y);
      const fw = (pw + GAP) / s, fh = (ph + GAP) / s;
      // nearest designed size, with a little hysteresis so it doesn't flick back and forth at the midpoint
      let best = sizesFor(l)[0], bd = Infinity;
      for (const sz of sizesFor(l)){
        const dd = (sz[0] - fw) ** 2 + (sz[1] - fh) ** 2 - (sz[0] === l.w && sz[1] === l.h ? .12 : 0);
        if (dd < bd){ bd = dd; best = sz; }
      }
      // between snaps the card follows your finger with rubber-band resistance
      const rb = (x, lim) => Math.sign(x) * lim * (1 - 1 / (Math.abs(x) * .55 / lim + 1));
      const apply = () => {
        l.w = best[0]; l.h = best[1];
        const ox = pw - (l.w * s - GAP), oy = ph - (l.h * s - GAP);
        stretchTo(rb(ox, l.w === 3 && ox > 0 ? 14 : d), rb(oy, d));
      };
      if (best[0] !== l.w || best[1] !== l.h){ flip(() => { apply(); paint(l); }); tick(10); }
      else apply();
    });
    const rend = e => {
      if (!r || e.pointerId !== r.id) return;
      r = null; el.classList.remove('resizing');
      const sx = el._sx || 0, sy = el._sy || 0;
      stretchTo(0, 0);
      if ((Math.abs(sx) > .5 || Math.abs(sy) > .5) && !REDUCE.matches){
        // let go: the stretch eases back onto the designed size
        const kf = [{ marginRight: -sx + 'px', marginBottom: -sy + 'px' }, { marginRight: '0px', marginBottom: '0px' }];
        const o = { duration: 380, easing: SETTLE };
        el._glass.animate(kf, o); el._grab.animate(kf, o);
      }
    };
    grab.addEventListener('pointerup', rend);
    grab.addEventListener('pointercancel', rend);
  }

  // FLIP: widgets glide to their new spots; a resized widget's card eases to its new size
  function flip(mutate, skip){
    const before = new Map();
    for (const [id, el] of els) before.set(id, el._glass.getBoundingClientRect());
    for (const el of els.values()){ (el._flip || []).forEach(a => a.cancel()); el._flip = null; }
    mutate();
    if (REDUCE.matches) return;
    for (const [id, el] of els){
      const a = before.get(id); if (!a || id === skip) continue;
      const b = el._glass.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top, dw = b.width - a.width, dh = b.height - a.height;
      const moved = Math.abs(dx) >= .5 || Math.abs(dy) >= .5, sized = Math.abs(dw) >= .5 || Math.abs(dh) >= .5;
      if (!moved && !sized) continue;
      const opts = { duration: 420, easing: SETTLE };
      const list = [el.animate([{ translate: `${dx}px ${dy}px` }, { translate: '0px 0px' }], opts)];
      if (sized){
        list.push(el._glass.animate([{ right: dw + 'px', bottom: dh + 'px' }, { right: '0px', bottom: '0px' }], opts));
        list.push(el._grab.animate([{ translate: `${-dw}px ${-dh}px` }, { translate: '0px 0px' }], opts));
      }
      el._flip = list;
    }
  }

  function addDevice(type){
    const used = new Set(state.items.map(l => l.name));
    let name = POOLS[type].find(n => !used.has(n));
    if (!name){ let i = 2; while (used.has(`${LABEL[type]} ${i}`)) i++; name = `${LABEL[type]} ${i}`; }
    const extra = type === 'thermo' ? { cur: 71, target: 68 } : type === 'camera' ? { ts: 'Just now' } : {};
    const l = mk(type, name, extra);
    flip(() => { state.items.push(l); render(); });
    const el = els.get(l.id);
    el.classList.add('added'); setTimeout(() => el.classList.remove('added'), 750);
    tick(10);
    requestAnimationFrame(() => el.scrollIntoView({ behavior: REDUCE.matches ? 'auto' : 'smooth', block: 'nearest' }));
    toast(`Added ${name}`);
  }

  function setEditing(on){
    state.editing = on;
    phone.classList.toggle('editing', on);
    document.getElementById('tbHome').hidden = on;
    document.getElementById('tbEdit').hidden = !on;
    // move keyboard focus only when the switch came from the keyboard, so touch/mouse never shows a focus ring
    const kb = document.activeElement && document.activeElement.matches && document.activeElement.matches(':focus-visible');
    if (kb) (on ? document.getElementById('doneBtn') : moreBtn).focus({ preventScroll: true });
  }

  // one menu, two layers: the main list, and an "Add" layer that slides in on top of it
  function showPanel(name, animate){
    const toAdd = name === 'add';
    const from = menu.offsetHeight;
    mpMain.hidden = toAdd; mpAdd.hidden = !toAdd;
    const panel = toAdd ? mpAdd : mpMain;
    panel.querySelector('.mi:not(.back)').focus({ preventScroll: true });
    if (!animate || REDUCE.matches) return;
    const to = menu.offsetHeight;
    menu.animate([{ height: from + 'px' }, { height: to + 'px' }], { duration: 320, easing: SETTLE });
    panel.animate([{ transform: `translateX(${toAdd ? 32 : -32}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 320, easing: SETTLE });
  }
  function closeMenus(){
    menu.classList.remove('open');
    scrim.classList.remove('open');
    moreBtn.setAttribute('aria-expanded', 'false');
  }
  // side 'left' = opened from the edit-mode +, which goes straight to the Add layer
  function openMenu(panel = 'main', side = 'right'){
    menu.classList.toggle('left', side === 'left');
    menu.classList.toggle('add-only', side === 'left');
    showPanel(panel, false);
    menu.classList.add('open'); scrim.classList.add('open');
    if (side === 'right') moreBtn.setAttribute('aria-expanded', 'true');
  }

  let tt;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  // long-press empty space to enter edit mode; tap empty space to leave it
  let lp = null;
  scrollEl.addEventListener('contextmenu', e => { if (!e.target.closest('.w')) e.preventDefault(); });
  scrollEl.addEventListener('pointerdown', e => {
    if (e.target.closest('.w') || e.button > 0) return;
    lp = { id: e.pointerId, x: e.clientX, y: e.clientY, fired: false };
    if (!state.editing) lp.t = setTimeout(() => {
      lp.fired = true; setEditing(true); tick(20);
      if (!REDUCE.matches) els.forEach(el => el.animate([{ scale: '.95' }, { scale: '1' }], { duration: 500, easing: SPRING.bouncy }));
    }, 450);
  });
  scrollEl.addEventListener('pointermove', e => {
    if (lp && e.pointerId === lp.id && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10){ clearTimeout(lp.t); lp.moved = true; }
  });
  const lpEnd = e => {
    if (!lp || e.pointerId !== lp.id) return;
    clearTimeout(lp.t);
    if (e.type === 'pointerup' && state.editing && !lp.fired && !lp.moved) setEditing(false);
    lp = null;
  };
  scrollEl.addEventListener('pointerup', lpEnd);
  scrollEl.addEventListener('pointercancel', lpEnd);

  moreBtn.addEventListener('click', () => menu.classList.contains('open') ? closeMenus() : openMenu('main', 'right'));
  scrim.addEventListener('pointerdown', closeMenus);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (scrim.classList.contains('open')) closeMenus(); else if (state.editing) setEditing(false);
  });
  menu.addEventListener('click', e => {
    const b = e.target.closest('.mi'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'add'){ showPanel('add', true); tick(6); return; }
    if (act === 'back'){ showPanel('main', true); return; }
    closeMenus();
    if (b.dataset.type) setTimeout(() => addDevice(b.dataset.type), 120);
    if (act === 'edit') setTimeout(() => setEditing(true), 120);
    if (act === 'settings') toast('Settings isn’t part of this prototype');
  });
  menu.querySelector('.mi[data-act=add] .tr').innerHTML = CHEV_DOWN;
  menu.querySelector('.back-chev').innerHTML = CHEV_DOWN;
  document.getElementById('editAdd').addEventListener('click', () => openMenu('add', 'left'));
  document.getElementById('doneBtn').addEventListener('click', () => setEditing(false));
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === t)));
  }));

  const MI = {
    light: ICON_ON.replace('#F8B541', '#1A1A1A'),
    lock: LOCK_FILL.replace('#F8B541', '#1A1A1A'),
    thermo: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 13.6V5a2 2 0 1 1 4 0v8.6a4 4 0 1 1-4 0Z" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9.5v5.5" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.9" fill="#1A1A1A"/></svg>',
    camera: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="6.5" width="13" height="11" rx="2.6" stroke="#1A1A1A" stroke-width="1.8"/><path d="M15.5 10.4 21 7.6v8.8l-5.5-2.8" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/></svg>'
  };
  mpAdd.querySelectorAll('.mi[data-type]').forEach(b => { b.querySelector('.g').innerHTML = MI[b.dataset.type]; });

  render();
})();
</script>
</body>
</html>
